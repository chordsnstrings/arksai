<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SparkleWash — Book a Car Wash</title>
<style>
  :root{ --ink:#0f1115; --muted:#6b7280; --line:#e8eaed; --brand:#0b6fae; --brand2:#0a6e72; --bg:#f6f8fa; --card:#fff; }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:440px;margin:0 auto;padding:22px 18px 40px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800}
  .brand h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  .pkgs{display:grid;gap:8px}
  .pkg{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s}
  .pkg:hover{border-color:#cdd3da}
  .pkg.sel{border-color:var(--brand);background:#f0f8fd}
  .pkg b{font-size:14.5px} .pkg span{color:var(--muted);font-size:12.5px;display:block}
  .price{font-weight:800;color:var(--brand)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,111,174,.12)}
  button{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;padding:14px;cursor:pointer}
  button:hover{background:#0a629b}
  .ok{text-align:center;padding:26px 16px}
  .check{width:54px;height:54px;border-radius:50%;background:#e7f6ee;color:#16a34a;display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;font-weight:700;letter-spacing:.06em;background:#f0f8fd;color:var(--brand);display:inline-block;padding:8px 14px;border-radius:10px;margin:8px 0}
  .recap{text-align:left;border-top:1px solid var(--line);margin-top:16px;padding-top:14px;font-size:14px}
  .recap div{display:flex;justify-content:space-between;margin:5px 0} .recap span{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">✦</div><h1>SparkleWash</h1></div>
  <p class="sub">Book a wash in under a minute — pick a package and a time.</p>
  <form id="form" class="card">
    <label>Wash package</label>
    <div class="pkgs" id="pkgs">
      <div class="pkg" data-name="Basic" data-price="20"><div><b>Basic</b><span>Exterior wash + dry</span></div><div class="price">AED 20</div></div>
      <div class="pkg sel" data-name="Deluxe" data-price="35"><div><b>Deluxe</b><span>Exterior + interior vacuum</span></div><div class="price">AED 35</div></div>
      <div class="pkg" data-name="Premium" data-price="60"><div><b>Premium</b><span>Full detail + wax + tyre shine</span></div><div class="price">AED 60</div></div>
    </div>
    <div class="row">
      <div><label>Date</label><input type="date" id="date" required></div>
      <div><label>Time</label><input type="time" id="time" value="10:00" required></div>
    </div>
    <label>Your name</label><input id="name" placeholder="Full name" required>
    <div class="row">
      <div><label>Car</label><input id="car" placeholder="e.g. Toyota Corolla" required></div>
      <div><label>Phone</label><input id="phone" placeholder="05x xxx xxxx" required></div>
    </div>
    <button type="submit">Confirm booking</button>
  </form>
</div>
<script>
  var sel="Deluxe", selPrice=35;
  document.getElementById('pkgs').addEventListener('click',function(e){
    var p=e.target.closest('.pkg'); if(!p)return;
    document.querySelectorAll('.pkg').forEach(function(x){x.classList.remove('sel')});
    p.classList.add('sel'); sel=p.dataset.name; selPrice=+p.dataset.price;
  });
  document.getElementById('date').valueAsDate=new Date(Date.now()+864e5);
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var code='SW-'+Math.random().toString(36).slice(2,7).toUpperCase();
    var b={code:code,pkg:sel,price:selPrice,date:date.value,time:time.value,name:name.value,car:car.value,phone:phone.value,ts:Date.now()};
    var all=JSON.parse(localStorage.getItem('sw_bookings')||'[]'); all.push(b); localStorage.setItem('sw_bookings',JSON.stringify(all));
    document.querySelector('.wrap').innerHTML=
      '<div class="brand"><div class="logo">✦</div><h1>SparkleWash</h1></div>'+
      '<div class="card ok"><div class="check">✓</div><h2 style="margin:.2em 0">You\'re booked!</h2>'+
      '<p style="color:#6b7280;margin:.2em 0 0">Your booking code</p><div class="code">'+code+'</div>'+
      '<div class="recap"><div><span>Package</span><b>'+sel+'</b></div>'+
      '<div><span>When</span><b>'+b.date+' · '+b.time+'</b></div>'+
      '<div><span>Car</span><b>'+b.car+'</b></div>'+
      '<div><span>Total</span><b>AED '+selPrice+'</b></div></div></div>';
  });
</script>
</body>
</html>
