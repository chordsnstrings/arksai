<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · __SITE_NAME__</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <a class="brand" href="index.html">__SITE_NAME__</a>
      <button class="nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">☰</button>
      <nav class="nav-links" id="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1>Get in touch.</h1>
        <p class="lead">Say how to reach you. Replace the details below, and wire the form to email/a backend when you need real submissions.</p>

        <form class="form" onsubmit="event.preventDefault(); this.reset(); alert('Thanks — replace this with a real submission.');">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© __SITE_NAME__</span>
      <span class="muted">Built with ArksAI</span>
    </div>
  </footer>

  <script src="site.js"></script>
</body>
</html>
